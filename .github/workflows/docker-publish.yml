name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 14 pre-existing errors here today (react-hooks/set-state-in-effect,
      # unrelated to any change this pipeline is building) - surfaced, not
      # blocking, until those get cleaned up.
      - run: npm run lint
        continue-on-error: true

      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* vars are inlined into the JS bundle at build time, so
      # the gateway's public URL has to be set as a repo Variable
      # (Settings -> Secrets and variables -> Actions -> Variables) named
      # NEXT_PUBLIC_API_URL, not left for the container to pick up at deploy.
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/somnog-ems-frontend:latest
            ghcr.io/${{ github.repository_owner }}/somnog-ems-frontend:${{ github.sha }}

  update-config-repo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ak004/somnog-config-repo
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Bump FRONTEND_IMAGE_TAG and push
        run: |
          sed -i "s/^FRONTEND_IMAGE_TAG=.*/FRONTEND_IMAGE_TAG=${{ github.sha }}/" images.env
          git config user.name "somnog-ci"
          git config user.email "ci@somnog.local"
          git commit -am "deploy: frontend @ ${{ github.sha }}"
          git push
